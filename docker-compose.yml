services:

  # ==========================================
  # MYSQL DATABASE
  # ==========================================

  mysql:

    image: mysql:8.0

    container_name: travelease-mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: travelease_db

    volumes:

      - mysql_data:/var/lib/mysql

      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]

      interval: 5s

      timeout: 5s

      retries: 20


  # ==========================================
  # NODE.JS BACKEND
  # ==========================================

  backend:

    build:

      context: .

      dockerfile: Dockerfile.backend

    container_name: travelease-backend

    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: travelease_db
      PORT: 5000

    ports:

      - "5000:5000"

    depends_on:

      mysql:

        condition: service_healthy


  # ==========================================
  # NGINX FRONTEND
  # ==========================================

  frontend:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: travelease-frontend

    restart: unless-stopped

    ports:

      - "80:80"

    depends_on:

      - backend


# ==========================================
# MYSQL PERSISTENT VOLUME
# ==========================================

volumes:

  mysql_data: