name: TravelEase CI

on:
  push:
    branches:
      - main
      - develop
      - feature/ci-cd

  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travelease_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize MySQL database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot travelease_db < database/init.sql

      - name: Start backend
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: travelease_db
          PORT: 5000
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/api/destinations > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Run API tests
        working-directory: backend
        env:
          API_URL: http://127.0.0.1:5000/api
        run: npm test

      - name: Show backend logs
        if: always()
        working-directory: backend
        run: cat server.log

      - name: Build frontend Docker image
        run: docker build -t travelease-frontend .

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t travelease-backend .